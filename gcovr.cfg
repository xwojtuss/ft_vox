filter = srcs/

# Entry point
exclude = srcs/main\.cpp
# Third-party single-header libraries
exclude = srcs/assets/stb_image\..*
exclude = srcs/assets/tiny_obj_loader\..*
# Needs a GPU, a window or a display - not unit-testable
exclude = srcs/render/vulkan/
exclude = srcs/render/gui/
exclude = srcs/platform/window/
exclude = srcs/platform/input/glfw/
exclude = srcs/app/Application\.cpp

# Ignore branches the compiler invents for exceptions/unreachable code
exclude-throw-branches = yes
exclude-unreachable-branches = yes

# clang reports implicit functions (e.g. destructors) on different lines per
# translation unit; merge them instead of aborting
merge-mode-functions = merge-use-line-min

# A template line counts once, covered if any instantiation ran it
merge-lines = yes

sort = uncovered-percent
print-summary = yes

# The build fails below this
fail-under-line = 80

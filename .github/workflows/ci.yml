name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux, GCC 14
            os: ubuntu-24.04
            preset: dev
            extra: -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 -DGLFW_BUILD_WAYLAND=OFF
          - name: macOS, Apple Clang
            os: macos-15
            preset: dev-clang
            extra: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-14 g++-14 ninja-build \
            libvulkan-dev vulkan-utility-libraries-dev glslang-tools \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja vulkan-headers vulkan-loader vulkan-utility-libraries glslang
          echo "CMAKE_PREFIX_PATH=$(brew --prefix)" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} ${{ matrix.extra }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  lint:
    name: Formatting and static analysis (warnings only)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-18 clang-tidy-18 ninja-build \
            libvulkan-dev vulkan-utility-libraries-dev glslang-tools \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
          pip install --user clang-format==21.1.8

      - name: Check formatting
        run: |
          git ls-files 'srcs/*.cpp' 'srcs/*.hpp' 'srcs/*.tpp' 'tests/*.cpp' 'tests/*.hpp' \
            | grep -v third_party/ \
            | xargs clang-format --dry-run --Werror

      - name: Configure for clang-tidy
        run: >
          cmake --preset dev-clang
          -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DGLFW_BUILD_WAYLAND=OFF

      - name: Run clang-tidy
        run: >
          run-clang-tidy-18 -p build/dev-clang -quiet
          '^(?!.*(third_party|_deps)).*/(srcs|tests)/.*\.cpp$'
